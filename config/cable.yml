# Solid Queue runs in forked processes (even with SOLID_QUEUE_IN_PUMA).
# The async adapter only delivers within one process, so Turbo Stream
# broadcasts from jobs never reach the browser. Use solid_cable everywhere
# jobs run so pub/sub goes through Postgres.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
