default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # One company employee scrape at a time (avoids Apify/LinkedIn empty results under load).
    - queues: employees
      threads: 1
      processes: 1
      polling_interval: 0.5
    - queues: default
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
